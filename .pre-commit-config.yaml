# Pre-commit hooks for Repo Radar (repo-radar).
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
#
# README.md and data/*.json are generated by scripts/update_status.py, so the formatting
# hooks skip them — otherwise every scheduled run would fight the hooks.

default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false
exclude: ^(README\.md|data/.*\.json)$

repos:
  # ---------------------------------------------------------------- hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^data/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------------------------------------------------------------- python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------- shell
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # ---------------------------------------------------------------- workflow lint
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # ---------------------------------------------------------------- repo gates (stdlib only)
  - repo: local
    hooks:
      - id: readme-markers
        name: README keeps its generated-section markers
        entry: >
          python3 -c "
          import sys, pathlib;
          text = pathlib.Path('README.md').read_text(encoding='utf-8');
          missing = [m for m in ('<!-- START_REPO_STATUS -->', '<!-- END_REPO_STATUS -->') if m not in text];
          sys.exit('README.md is missing: ' + ', '.join(missing) if missing else 0)
          "
        language: system
        pass_filenames: false
        files: ^(README\.md|scripts/update_status\.py)$

      - id: repos-config-shape
        name: data/repos.json has a repositories list
        entry: >
          python3 -c "
          import json, sys, pathlib;
          data = json.loads(pathlib.Path('data/repos.json').read_text(encoding='utf-8'));
          repos = data.get('repositories');
          sys.exit(None if isinstance(repos, list) and repos else 'data/repos.json needs a non-empty repositories list')
          "
        language: system
        pass_filenames: false
        files: ^(data/repos\.json|scripts/sync_repos\.py)$

      - id: scripts-compile
        name: tracker scripts compile
        entry: python3 -m py_compile
        language: system
        files: ^scripts/.*\.py$
